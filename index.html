<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3a6cb2">
  <title>Michelle &amp; Steven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Parisienne&display=swap">
  <style>
    :root { color-scheme: light; font-family: Georgia, 'Times New Roman', serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: linear-gradient(180deg, #3a6cb2 0%, #6c9bd1 55%, #8caac7 100%); color: #fff; }
    .gate { width: min(100%, 360px); text-align: center; text-shadow: 0 1px 12px rgba(20,45,90,.34); }
    .script { font-family: 'Parisienne', cursive; font-size: clamp(40px, 13vw, 60px); line-height: 1.1; margin: 0 0 6px; }
    .sub { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; margin: 0 0 30px; opacity: .92; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label.pw { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; opacity: .95; }
    input[type=password] { font: 17px/1 Georgia, serif; text-align: center; letter-spacing: .08em; padding: 13px 14px;
      border: 1px solid rgba(255,255,255,.65); border-radius: 10px; background: rgba(255,255,255,.14); color: #fff; }
    input[type=password]::placeholder { color: rgba(255,255,255,.6); }
    input[type=password]:focus { outline: none; border-color: #fff; background: rgba(255,255,255,.2); }
    button { font: 14px/1 Georgia, serif; letter-spacing: .12em; text-transform: uppercase; padding: 13px 14px; cursor: pointer;
      border: 0; border-radius: 10px; background: #fff; color: #2c4a78; }
    button:active { transform: translateY(1px); }
    .remember { display: inline-flex; align-items: center; gap: 7px; font: 13px/1 Georgia, serif; opacity: .9; justify-content: center; margin-top: 2px; }
    .remember input { width: 15px; height: 15px; accent-color: #2c4a78; }
    .err { min-height: 18px; font: 13px/1.4 Georgia, serif; color: #ffe0e0; margin-top: 2px; }
    noscript { display: block; margin-top: 16px; font: 14px/1.5 Georgia, serif; }
  </style>
</head>
<body>
  <div class="gate">
    <p class="script">Michelle &amp; Steven</p>
    <p class="sub">Please enter the password</p>
    <form id="f" autocomplete="off">
      <label class="pw" for="pw">Password</label>
      <input id="pw" type="password" placeholder="••••••••" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
      <button type="submit">Enter</button>
      <span class="remember"><input id="rm" type="checkbox"><label for="rm">Remember me on this device</label></span>
    </form>
    <p class="err" id="err" role="alert"></p>
    <noscript>This site needs JavaScript enabled to open.</noscript>
  </div>

    async function decrypt(pw) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt: b2u(SALT), iterations: ITERS, hash:'SHA-256' },

      const html = await decrypt(pw);          // throws on wrong password

    document.getElementById('f').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('err'); err.textContent = '';
      try { await tryPw(document.getElementById('pw').value, document.getElementById('rm').checked); }

    (async () => { let pw; try { pw = localStorage.getItem(KEY); } catch (e) {}
