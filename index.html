<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Save the weekend for Michelle Chuang and Steven Xu. September 17–19, 2027 · Point Reyes, California.">
  <meta name="theme-color" content="#f7f3eb">
  <title>Michelle &amp; Steven · Save the Weekend</title>
  <style>
    :root { color-scheme: light; background: #f7f3eb; color: #343f35; font-family: Georgia, 'Times New Roman', serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: 24px 20px 30px; }
    .invitation { display: block; width: auto; max-width: 100%; height: auto; max-height: calc(100svh - 210px); object-fit: contain; }
    .countdown { width: min(100%, 460px); text-align: center; padding-top: 25px; }
    h1 { font-size: 12px; line-height: 1.5; font-weight: normal; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 18px; }
    .clock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; font-variant-numeric: tabular-nums; }
    .number { display: block; font-size: clamp(28px, 5vw, 38px); line-height: 1; }
    .unit { display: block; font: 9px/1.6 Arial, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 8px; color: #687166; }
    .date { font-size: 11px; color: #687166; line-height: 1.5; margin: 17px 0 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      main { padding: 0 0 28px; }
      .invitation { width: 100%; max-height: none; }
      .countdown { padding: 26px 22px 0; }
    }
  </style>
</head>
<body>
  <main>
    <img class="invitation" src="wedding-invitation.png" width="1024" height="1536"
      alt="Michelle Chuang &amp; Steven Xu. Save the Weekend. September 17–19, 2027. Point Reyes, California."
      fetchpriority="high">
    <section class="countdown" aria-labelledby="countdown-title">
      <h1 id="countdown-title">Counting down to our wedding weekend</h1>
      <div class="clock" role="timer" aria-label="Time remaining until September 17, 2027 at 5 p.m. Pacific">
        <div><span class="number" id="days">—</span><span class="unit">Days</span></div>
        <div><span class="number" id="hours">—</span><span class="unit">Hours</span></div>
        <div><span class="number" id="minutes">—</span><span class="unit">Minutes</span></div>
        <div><span class="number" id="seconds">—</span><span class="unit">Seconds</span></div>
      </div>
      <p class="date"><time datetime="2027-09-17T17:00:00-07:00">September 17, 2027 · 5:00 p.m. Pacific</time></p>
      <noscript><p class="date">Enable JavaScript to see the live countdown.</p></noscript>
    </section>
  </main>
  <script>
    // September 17 is in Pacific Daylight Time. An explicit offset ensures
    // every visitor counts down to the same instant, in any time zone.
    const weddingTime = Date.parse('2027-09-17T17:00:00-07:00');
    const fields = ['days', 'hours', 'minutes', 'seconds'].map(id => document.getElementById(id));
    let timer;
    function updateCountdown() {
      const remaining = Math.max(0, Math.floor((weddingTime - Date.now()) / 1000));
      const values = [
        Math.floor(remaining / 86400),
        Math.floor(remaining / 3600) % 24,
        Math.floor(remaining / 60) % 60,
        remaining % 60
      ];
      fields.forEach((field, index) => {
        field.textContent = String(values[index]).padStart(2, '0');
      });
      if (remaining === 0) {
        document.getElementById('countdown-title').textContent = 'Our wedding weekend is here!';
        clearInterval(timer);
      }
    }
    updateCountdown();
    if (Date.now() < weddingTime) timer = setInterval(updateCountdown, 1000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateCountdown();
    });
  </script>
</body>
</html>
