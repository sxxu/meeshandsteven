<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Save the weekend for Michelle Chuang and Steven Xu. September 17–19, 2027 · Point Reyes, California.">
  <meta name="theme-color" content="#3664a8">
  <title>Michelle &amp; Steven · Save the Weekend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap">
  <style>
    :root {
      color-scheme: light; background: #f7f3eb; color: #343f35;
      font-family: Georgia, 'Times New Roman', serif;
      --display: 'Cormorant Garamond', Garamond, Georgia, 'Times New Roman', serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }

    /* Photo fills the top of the screen; the countdown peeks in just below it. */
    .hero { position: relative; height: calc(100svh - 170px); min-height: 520px; overflow: hidden; background: #3664a8; }
    .hero picture, .hero img { display: block; width: 100%; height: 100%; }
    .hero img { object-fit: cover; object-position: 50% 80%; }

    .words { position: absolute; z-index: 1; color: #fff; font-family: var(--display); font-weight: 500;
      text-shadow: 0 1px 14px rgba(20, 45, 90, .35); }
    .words p, .words h1 { margin: 0; font-weight: 500; }
    .names { font-size: clamp(19px, 2.4vw, 64px); letter-spacing: .07em; line-height: 1.3; }
    .save  { font-size: clamp(28px, 3.9vw, 104px); letter-spacing: .07em; line-height: 1.2; margin-top: .35em !important; }
    .when  { font-size: clamp(16px, 1.9vw, 50px); letter-spacing: .12em; line-height: 1.4; margin-top: .4em !important; }
    .where { font-size: clamp(15px, 1.7vw, 44px); letter-spacing: .14em; line-height: 1.4; margin-top: .15em !important; }

    /* Wide screens: photo is landscape, words sit in the open sky on the left. */
    .words { left: clamp(24px, 7vw, 150px); top: clamp(36px, 9%, 120px); text-align: left; }

    /* Tall screens (phones, tablets held upright): portrait photo, words centered. */
    @media (orientation: portrait) {
      .words { left: 0; right: 0; top: 7%; padding: 0 16px; text-align: center; }
      .names { font-size: clamp(18px, 5.4vw, 30px); }
      .save  { font-size: clamp(28px, 8vw, 46px); }
      .when  { font-size: clamp(16px, 4.4vw, 24px); }
      .where { font-size: clamp(15px, 4vw, 21px); }
      .hero img { object-position: 50% 75%; }
    }

    .countdown { width: min(100%, 460px); margin: 0 auto; text-align: center; padding: 25px 20px 34px; }
    h2 { font-size: 12px; line-height: 1.5; font-weight: normal; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 18px; }
    .clock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; font-variant-numeric: tabular-nums; }
    .number { display: block; font-size: clamp(28px, 5vw, 38px); line-height: 1; }
    .unit { display: block; font: 9px/1.6 Arial, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 8px; color: #687166; }
    .date { font-size: 11px; color: #687166; line-height: 1.5; margin: 17px 0 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <picture>
        <source media="(orientation: portrait)" srcset="hero-portrait.jpg" width="1024" height="1536">
        <img src="hero-landscape.jpg" width="1536" height="1024" fetchpriority="high" decoding="async"
          alt="Two hands reach toward each other in a clear blue sky: one offering an open ring box, the other holding a bouquet of white flowers tied with a red ribbon.">
      </picture>
      <div class="words">
        <h1 class="names">Michelle Chuang &amp; Steven Xu</h1>
        <p class="save">Save the Weekend</p>
        <p class="when">September 17–19, 2027</p>
        <p class="where">Point Reyes, California</p>
      </div>
    </header>
    <section class="countdown" aria-labelledby="countdown-title">
      <h2 id="countdown-title">Counting down to our wedding weekend</h2>
      <div class="clock" role="timer" aria-label="Time remaining until September 17, 2027 at 5 p.m. Pacific">
        <div><span class="number" id="days">—</span><span class="unit">Days</span></div>
        <div><span class="number" id="hours">—</span><span class="unit">Hours</span></div>
        <div><span class="number" id="minutes">—</span><span class="unit">Minutes</span></div>
        <div><span class="number" id="seconds">—</span><span class="unit">Seconds</span></div>
      </div>
      <p class="date"><time datetime="2027-09-17T17:00:00-07:00">September 17, 2027 · 5:00 p.m. Pacific</time></p>
      <noscript><p class="date">Enable JavaScript to see the live countdown.</p></noscript>
    </section>
  </main>
  <script>
    // September 17 is in Pacific Daylight Time. An explicit offset ensures
    // every visitor counts down to the same instant, in any time zone.
    const weddingTime = Date.parse('2027-09-17T17:00:00-07:00');
    const fields = ['days', 'hours', 'minutes', 'seconds'].map(id => document.getElementById(id));
    let timer;
    function updateCountdown() {
      const remaining = Math.max(0, Math.floor((weddingTime - Date.now()) / 1000));
      const values = [
        Math.floor(remaining / 86400),
        Math.floor(remaining / 3600) % 24,
        Math.floor(remaining / 60) % 60,
        remaining % 60
      ];
      fields.forEach((field, index) => {
        field.textContent = String(values[index]).padStart(2, '0');
      });
      if (remaining === 0) {
        document.getElementById('countdown-title').textContent = 'Our wedding weekend is here!';
        clearInterval(timer);
      }
    }
    updateCountdown();
    if (Date.now() < weddingTime) timer = setInterval(updateCountdown, 1000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateCountdown();
    });
  </script>
</body>
</html>
